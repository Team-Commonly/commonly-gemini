name: Drift check

# This repository is a published copy of plugins/commonly-gemini/ in
# Team-Commonly/commonly, the source. The job fails when the copy differs
# from the source, or when the pinned @commonlyai/mcp is a minor release or
# more behind npm. GitHub pauses a schedule after 60 days with no activity in
# the repository; push or run it by hand to resume.

on:
  push:
  pull_request:
  schedule:
    - cron: '17 14 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Same files as the source
        run: |
          set -euo pipefail
          base=https://raw.githubusercontent.com/Team-Commonly/commonly/main/plugins/commonly-gemini
          for f in gemini-extension.json GEMINI.md README.md LICENSE; do
            curl -fsSL "$base/$f" -o "$RUNNER_TEMP/$f"
            diff -u "$RUNNER_TEMP/$f" "$f" || { echo "::error file=$f::differs from Team-Commonly/commonly plugins/commonly-gemini/$f"; exit 1; }
          done
      - name: Pin is not a minor release behind npm
        run: |
          set -euo pipefail
          pinned=$(node -e "const a=require('./gemini-extension.json').mcpServers.commonly.args;const s=a.find(x=>x.startsWith('@commonlyai/mcp@'));console.log(s.split('@').pop())")
          latest=$(npm view @commonlyai/mcp dist-tags.latest)
          echo "pinned $pinned, npm latest $latest"
          node -e "const [p,l]=process.argv.slice(1).map(v=>v.split(/[-+]/)[0].split('.').map(Number));if([...p,...l].some(Number.isNaN)){console.log('::error::cannot compare versions '+process.argv[1]+' and '+process.argv[2]);process.exit(1)}if(l[0]>p[0]||(l[0]===p[0]&&l[1]>p[1])){console.log('::error::@commonlyai/mcp '+process.argv[2]+' is a minor release or more ahead of the pin '+process.argv[1]+'. Move the pin in Team-Commonly/commonly plugins/commonly-gemini after a walk, then sync this copy.');process.exit(1)}" "$pinned" "$latest"
